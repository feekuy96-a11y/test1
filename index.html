async function saveRc(o,no){if(!CFG.BRIDGE_URL)return;const t=await tok();for(const c of['customer','shop']){const r=await bridge('receipt',no+'-'+c,'',t,rcDoc(o,no,c)),f=await Q(sb.from('files').insert({kind:'receipt',drive_file_id:r.drive_file_id,url:r.url,name:no+'-'+c}).select('id').single());await Q(sb.from('receipts').update({file_id:f.id}).eq('order_id',o.id).eq('copy_type',c))}toast('บันทึกใบเสร็จ PDF ลง Drive แล้ว 📄')}
/* ===== ผังร้านแบบลากวาง (บันทึกลงตาราง floor_objects) ===== */
const FK={square:['โต๊ะเหลี่ยม',90,60],round:['โต๊ะกลม',70,70],wall:['ผนัง',200,12],door:['ประตู',64,10],toilet:['ห้องน้ำ',80,70],cashier:['แคชเชียร์',90,50],kitchen:['ครัว',130,80]},isT=o=>o.kind=='square'||o.kind=='round',P={list:[],z:1,sel:0,busy:new Set()};
const bb=o=>{const q=o.rot%180,hw=(q?o.h:o.w)/2,hh=(q?o.w:o.h)/2,cx=o.x+o.w/2,cy=o.y+o.h/2;return[cx-hw,cy-hh,cx+hw,cy+hh]},hit=(a,b)=>{if(a.kind=='door'||b.kind=='door')return 0;const p=bb(a),q=bb(b);return p[0]<q[2]&&p[2]>q[0]&&p[1]<q[3]&&p[3]>q[1]},bad=o=>{const p=bb(o);return p[0]<0||p[1]<0||p[2]>1000||p[3]>600||P.list.some(x=>x.id!=o.id&&hit(o,x))};
const nextCode=()=>'T'+(1+Math.max(0,...P.list.filter(isT).map(x=>+String(x.code).replace(/\D/g,'')||0)));
function spot(o){const t={...o,w:o.w+10,h:o.h+10};for(let y=0;y<=600-t.h;y+=10)for(let x=0;x<=1000-t.w;x+=10){t.x=o.x=x;t.y=o.y=y;if(!bad(t))return 1}return 0}
async function zoneId(){const z=await Q(sb.from('zones').select('id').limit(1));return z[0]?z[0].id:(await Q(sb.from('zones').insert({name:'ชั้นล่าง'}).select('id').single())).id}
const fo=o=>`<div class="fo k-${o.kind}${P.busy.has(o.code)?' busy':''}${P.sel==o.id?' sel':''}" data-id="${o.id}" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;transform:rotate(${o.rot}deg)">${isT(o)?e(o.code):'wd'.includes(o.kind[0])&&o.kind!='wall'&&o.kind!='door'?'':o.kind=='wall'||o.kind=='door'?'':FK[o.kind][0]}</div>`;
async function planView(){const[l,ord]=await Promise.all([Q(sb.from('floor_objects').select('*').order('id')),Q(sb.from('orders').select('table_code').in('status',['new','cook','served']))]);P.list=l;P.busy=new Set(ord.map(x=>x.table_code));if(!P.fit){P.z=Math.min(1,(innerWidth-28)/1000);P.fit=1}const s=l.find(o=>o.id==P.sel);setTimeout(bindPlan,0);
return`<h2>ผังร้าน</h2><div class=chips>${Object.entries(FK).map(([k,v])=>`<button onclick="A.padd('${k}')">+ ${v[0]}</button>`).join('')}</div><div class=chips><button onclick="P.z=Math.max(.3,P.z-.1);A.go()">ซูม −</button><button onclick="P.z=Math.min(1.5,P.z+.1);A.go()">ซูม +</button><button onclick="P.z=Math.min(1,(innerWidth-28)/1000);A.go()">พอดีจอ</button><button onclick="A.parr()">จัดเรียงโต๊ะ</button><button onclick="A.pgenForm()">สร้างโต๊ะอัตโนมัติ</button></div><div class=fw style="height:${600*P.z+4}px"><div class=fc id=fc style="transform:scale(${P.z})">${l.map(fo).join('')}</div></div>${s?`<div class=card><b>${e(isT(s)?'โต๊ะ '+s.code:FK[s.kind][0])}</b><div class=chips><button onclick="A.pm('rot')">หมุน 90°</button><button onclick="A.pm('w',10)">กว้าง +</button><button onclick="A.pm('w',-10)">กว้าง −</button><button onclick="A.pm('h',10)">สูง +</button><button onclick="A.pm('h',-10)">สูง −</button>${isT(s)?'<button onclick="A.prn()">เปลี่ยนชื่อ</button>':''}<button class=r onclick="A.pdel()">ลบ</button></div></div>`:'<p><small>ลากเพื่อย้าย แตะเพื่อเลือก โต๊ะสีทอง = มีออเดอร์ค้าง QR ของโต๊ะที่เปลี่ยนชื่อต้องพิมพ์ใหม่</small></p>'}`}
function bindPlan(){const c=$('#fc');if(!c)return;c.onpointerdown=ev=>{const d=ev.target.closest('.fo');if(!d)return;const o=P.list.find(x=>x.id==d.dataset.id);P.sel=o.id;const sx=ev.clientX,sy=ev.clientY,ox=o.x,oy=o.y;let mv=0;d.setPointerCapture(ev.pointerId);
d.onpointermove=m=>{mv=1;const t={...o,x:Math.round((ox+(m.clientX-sx)/P.z)/10)*10,y:Math.round((oy+(m.clientY-sy)/P.z)/10)*10};if(!bad(t)){o.x=t.x;o.y=t.y;d.style.left=o.x+'px';d.style.top=o.y+'px'}};
d.onpointerup=async()=>{d.onpointermove=d.onpointerup=null;try{mv&&await Q(sb.from('floor_objects').update({x:o.x,y:o.y}).eq('id',o.id))}catch(x){toast(x.message,'err')}shell()}}}
const cur=()=>P.list.find(o=>o.id==P.sel);
def({async padd(k){const v=FK[k],o={zone_id:await zoneId(),kind:k,code:isT({kind:k})?nextCode():null,x:0,y:0,w:v[1],h:v[2],rot:0,seats:4};if(!spot(o))throw Error('พื้นที่เต็ม ไม่มีที่วางเพิ่ม');P.sel=(await Q(sb.from('floor_objects').insert(o).select().single())).id;await shell()},
async pm(a,d){const o=cur(),t={...o};a=='rot'?t.rot=(o.rot+90)%360:t[a]=Math.max(10,o[a]+d);if(bad(t))throw Error('ชนกับวัตถุอื่นหรือเกินพื้นที่');await Q(sb.from('floor_objects').update({[a]:t[a]}).eq('id',o.id));await shell()},
prn(){modal(`<h3>ชื่อโต๊ะ</h3><input id=rn value="${e(cur().code)}"><p><button class=p style="width:100%" onclick="A.prn2()">บันทึก</button></p>`)},
async prn2(){const n=$('#rn').value.trim().replace(/[\/\\'" ]/g,'');if(!n)throw Error('กรุณากรอกชื่อ');const{error}=await sb.from('floor_objects').update({code:n}).eq('id',P.sel);if(error)throw Error(/duplicate/i.test(error.message)?'ชื่อโต๊ะซ้ำ':error.message);closeM();await shell()},
pdel(){const o=cur();if(isT(o)&&P.busy.has(o.code))throw Error('โต๊ะนี้ยังมีออเดอร์ค้าง ลบไม่ได้');ask('ลบวัตถุนี้?',async()=>{await Q(sb.from('floor_objects').delete().eq('id',o.id));P.sel=0;await shell()})},
async parr(){const ts=P.list.filter(isT),old=ts.map(o=>[o.x,o.y,o.rot]),c=Math.floor(1000/110);ts.forEach((o,i)=>{o.x=(i%c)*110+20;o.y=Math.floor(i/c)*100+20;o.rot=0});if(P.list.some(bad)){ts.forEach((o,i)=>{[o.x,o.y,o.rot]=old[i]});throw Error('จัดเรียงแล้วชนกับผนัง/ห้อง ย้ายวัตถุอื่นก่อน')}await Promise.all(ts.map(o=>Q(sb.from('floor_objects').update({x:o.x,y:o.y,rot:0}).eq('id',o.id))));await shell()},
pgenForm(){modal(`<h3>สร้างโต๊ะอัตโนมัติ</h3><label>จำนวนโต๊ะที่จะเพิ่ม (1-60)</label><input id=gn type=number value=8><p><button class=p style="width:100%" onclick="A.pgen()">สร้าง</button></p>`)},
async pgen(){const n=+$('#gn').value;if(!(n>=1&&n<=60))throw Error('จำนวน 1-60');closeM();const z=await zoneId(),rows=[];for(let i=0;i<n;i++){const o={zone_id:z,kind:'square',code:nextCode(),x:0,y:0,w:90,h:60,rot:0,seats:4};if(!spot(o)){toast('พื้นที่เต็ม วางได้ '+i+' ตัว','err');break}P.list.push({...o,id:'tmp'+i});rows.push(o)}rows.length&&await Q(sb.from('floor_objects').insert(rows));await shell()}});
flush();

route();
</script></body></html>
